apiVersion: v1
kind: Service
metadata:
  name: filebrowser
spec:
  selector:
    app.kubernetes.io/name: filebrowser
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Through the tunnel: Cloudflare Access (files app) → cloudflared → Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filebrowser
spec:
  rules:
    - host: files.gaitovrat.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: filebrowser
                port:
                  name: http
