# kube-state-metrics: state of Kubernetes objects (pods, deployments, PVCs,
# ...) as metrics for VictoriaMetrics (apps/victoria-metrics.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/prometheus-community/charts
    chart: kube-state-metrics
    targetRevision: 8.8.0
    helm:
      releaseName: kube-state-metrics
      valuesObject:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
