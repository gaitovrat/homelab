# Argo CD manages itself. The Ansible argocd role reads this file (chart,
# version, values) to bootstrap a new cluster, then hands over to it.
# No finalizer: deleting this Application leaves Argo CD running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/argoproj/argo-helm
    chart: argo-cd
    targetRevision: 10.11.1
    helm:
      # Same release name as the bootstrap install, so Argo CD adopts the
      # resources it already runs instead of creating a second copy.
      releaseName: argocd
      # Lean values for a 4 GB node: no Dex (no SSO yet, local admin only),
      # no notifications controller. Every other component runs a single
      # replica, without HA Redis.
      valuesObject:
        # Public URL (Cloudflare Tunnel + Access, see terraform/cloudflare).
        # The chart derives the Ingress host and Argo CD's `url` from it.
        global:
          domain: argocd.gaitovrat.dev
        dex:
          enabled: false
        notifications:
          enabled: false
        controller:
          replicas: 1
        server:
          replicas: 1
          # Cloudflare → tunnel → Traefik (plain HTTP) → argocd-server.
          ingress:
            enabled: true
            ingressClassName: traefik
        repoServer:
          replicas: 1
        applicationSet:
          replicas: 1
        redis-ha:
          enabled: false
        configs:
          params:
            # TLS ends at Cloudflare; the tunnel and Traefik speak HTTP,
            # so the server must not redirect to HTTPS itself.
            server.insecure: true
          cm:
            # No terminal into pods from the UI.
            exec.enabled: false
            # SSO only (below), no local admin. If SSO breaks, use the CLI
            # in core mode over Tailscale (apps/README.md).
            admin.enabled: false
            # SSO through Cloudflare Access as the OIDC provider (no Dex):
            # the Access SaaS app "Argo CD SSO" in terraform/cloudflare, which
            # only you can sign in to (GitHub). The client secret is the
            # SealedSecret in manifests/argocd-oidc.
            oidc.config: |
              name: Cloudflare Access
              issuer: https://gaitovrat.cloudflareaccess.com/cdn-cgi/access/sso/oidc/24444ed1344369422f729358433b248d6279588842bdae70418f77a88626ed83
              clientID: 24444ed1344369422f729358433b248d6279588842bdae70418f77a88626ed83
              clientSecret: $argocd-oidc-cloudflare:clientSecret
              requestedScopes: [openid, email, profile]
          rbac:
            # Nobody gets anything by default. Your Access user ID (the
            # token's `sub`, opaque, so no email in this public repo) is
            # admin.
            policy.default: ""
            policy.csv: |
              g, 71fc5e5c-1a5f-5bd9-94e1-5b2536589327, role:admin
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Argo CD's CRDs are too big for client-side apply's
      # last-applied-configuration annotation.
      - ServerSideApply=true
