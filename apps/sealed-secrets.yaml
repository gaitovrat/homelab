# Sealed Secrets: decrypts SealedSecrets committed to this public repo into
# Secrets in the cluster. Backing up the sealing key and sealing a secret:
# see the README.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # kubeseal's default controller name and namespace, so it needs no
        # --controller-name/--controller-namespace flags.
        fullnameOverride: sealed-secrets-controller
        # One sealing key for good instead of a new one every 30 days, so a
        # single backup of it stays enough to restore every SealedSecret.
        # Renewal wouldn't re-encrypt existing SealedSecrets anyway.
        keyrenewperiod: "0"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
