# Landing page at https://gaitovrat.dev: a static page linking to every
# service, served by nginx. Public: each linked app has its own Access login.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: landing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gaitovrat/homelab.git
    targetRevision: main
    path: manifests/landing
  destination:
    server: https://kubernetes.default.svc
    namespace: landing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
