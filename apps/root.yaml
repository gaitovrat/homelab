# The root "app of apps": syncs every Application in apps/, this one
# included. The Ansible argocd role applies it once to bootstrap a cluster.
# No finalizer, so deleting it leaves the child apps and their workloads.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gaitovrat/homelab.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
