# Grafana: dashboards for the metrics in VictoriaMetrics
# (apps/victoria-metrics.yaml), at https://stats.gaitovrat.dev behind
# Cloudflare Access. Grafana trusts the Access login (no second sign-in):
# dashboards and the data source come from this file, and there is no
# admin user or login form.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/grafana-community/helm-charts
    chart: grafana
    targetRevision: 14.2.0
    helm:
      releaseName: grafana
      valuesObject:
        # Cloudflare Access app `stats` (terraform/cloudflare) guards it;
        # never enable this on a host without one.
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - stats.gaitovrat.dev
        # No admin user, so the chart makes no admin Secret (a random
        # password Argo CD would regenerate on every sync).
        env:
          GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
        grafana.ini:
          server:
            root_url: https://stats.gaitovrat.dev
          analytics:
            reporting_enabled: false
            check_for_updates: false
          # Single sign-on through Cloudflare Access: Access puts a signed
          # JWT of the signed-in user in this header on every request, and
          # Grafana checks it against Access's keys. A request without a
          # valid token (e.g. from the LAN straight to Traefik) gets nothing.
          auth:
            disable_login_form: true
          auth.jwt:
            enabled: true
            header_name: Cf-Access-Jwt-Assertion
            email_claim: email
            username_claim: email
            jwk_set_url: https://gaitovrat.cloudflareaccess.com/cdn-cgi/access/certs
            cache_ttl: 60m
            # Only tokens Access issued for the `stats` app (its AUD tag),
            # not ones for the other Access apps.
            expect_claims: '{"iss": "https://gaitovrat.cloudflareaccess.com", "aud": ["fb754e29f0d49e4d0a0cf75663c7e4b9c8e71feec895d024f9db1cdb738029bf"]}'
            auto_sign_up: true
            # Your Access user ID (`sub`, opaque, so no email in this public
            # repo; same ID as in apps/argocd.yaml) is Admin, anyone else
            # Access lets in is a Viewer.
            role_attribute_path: "sub == '71fc5e5c-1a5f-5bd9-94e1-5b2536589327' && 'Admin' || 'Viewer'"
        # No `helm test` pod.
        testFramework:
          enabled: false
        # Nothing to keep: settings and dashboards are provisioned at start.
        persistence:
          enabled: false
        # Grafana 13 builds its search index and API server at start; at
        # 256Mi it was OOMKilled in a loop and never became ready.
        resources:
          requests:
            cpu: 20m
            memory: 192Mi
          limits:
            memory: 512Mi
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: VictoriaMetrics
                uid: victoriametrics
                # VictoriaMetrics answers the Prometheus query API.
                type: prometheus
                url: http://victoria-metrics.monitoring.svc:8428
                access: proxy
                isDefault: true
                jsonData:
                  # The scrape interval, so $__rate_interval is right.
                  timeInterval: 30s
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: true
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/default
        # Downloaded at pod start, pinned to a tag or commit (Renovate
        # doesn't bump these; update the ref by hand).
        dashboards:
          default:
            # Host details, including temperatures (Hardware Misc).
            node-exporter-full:
              url: https://raw.githubusercontent.com/rfmoz/grafana-dashboards/6c2de7ebaea4dd1dad7089d86d75de71417a3d0b/prometheus/node-exporter-full.json
            # Cluster, namespace, node and pod views (dotdc/grafana-dashboards-kubernetes).
            k8s-views-global:
              url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-global.json
              datasource: [{name: DS_PROMETHEUS, value: victoriametrics}]
            k8s-views-namespaces:
              url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-namespaces.json
              datasource: [{name: DS_PROMETHEUS, value: victoriametrics}]
            k8s-views-nodes:
              url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-nodes.json
              datasource: [{name: DS_PROMETHEUS, value: victoriametrics}]
            k8s-views-pods:
              url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-pods.json
              datasource: [{name: DS_PROMETHEUS, value: victoriametrics}]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
