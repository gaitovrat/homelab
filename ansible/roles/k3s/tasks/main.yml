---
# Read-only, so these also run under --check.
- name: Get installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Get the node's tailnet IPv4
  ansible.builtin.command: tailscale ip -4
  register: k3s_tailscale_ip
  changed_when: false
  check_mode: false

- name: Set k3s facts
  ansible.builtin.set_fact:
    k3s_installed: "{{ k3s_installed_version.rc == 0 }}"
    k3s_tailnet_ips: "{{ k3s_tailscale_ip.stdout_lines }}"

- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# Written before the first install, so k3s starts with it. Later changes
# restart k3s (the handler skips a node that k3s was only just installed on).
- name: Configure k3s
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: Restart k3s

- name: Download k3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
    force: true
  when: k3s_version not in k3s_installed_version.stdout | default('')

# Installs or upgrades the binary to k3s_version, then (re)starts k3s. Bumps
# come through Renovate PRs against k3s_version; k3s never updates itself.
- name: Install k3s {{ k3s_version }}
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_version not in k3s_installed_version.stdout | default('')
  changed_when: true

- name: Run pending handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for the node to be Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ ansible_facts['hostname'] }} --timeout=10s
  register: k3s_node_ready
  # The node object only appears once k3s is up after an install or restart.
  until: k3s_node_ready.rc == 0
  retries: 18
  delay: 10
  changed_when: false
  when: not ansible_check_mode

# The kubeconfig holds cluster-admin credentials: keep it out of logs and diffs.
- name: Read kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig
  no_log: true
  when: k3s_installed or not ansible_check_mode

- name: Create local kubeconfig directory
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_dest | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Read local kubeconfig
  ansible.builtin.slurp:
    src: "{{ k3s_kubeconfig_dest }}"
  register: k3s_local_kubeconfig
  failed_when: false
  delegate_to: localhost
  become: false
  no_log: true
  when: k3s_kubeconfig is not skipped

# Replaces this cluster's entries (named k3s_cluster_name) and keeps every
# other cluster, user and context, and the current context. The server
# address is the MagicDNS name instead of 127.0.0.1. `backup` keeps the
# previous file next to it (also 0600) whenever it changes.
- name: Merge cluster into the local kubeconfig
  ansible.builtin.copy:
    dest: "{{ k3s_kubeconfig_dest }}"
    mode: "0600"
    backup: true
    content: "{{ k3s_merged | to_nice_yaml(indent=2) }}"
  vars:
    k3s_name: "{{ k3s_cluster_name }}"
    k3s_node: "{{ k3s_kubeconfig.content | b64decode | from_yaml }}"
    k3s_local: >-
      {{ (k3s_local_kubeconfig.content | b64decode | from_yaml
          if 'content' in k3s_local_kubeconfig else {}) | default({}, true) }}
    k3s_merged: >-
      {{ k3s_local | combine({
           'apiVersion': 'v1',
           'kind': 'Config',
           'preferences': k3s_local.preferences | default({}),
           'clusters': (k3s_local.clusters | default([], true)
                        | rejectattr('name', 'equalto', k3s_name) | list)
                       + [{'name': k3s_name,
                           'cluster': k3s_node.clusters[0].cluster
                                      | combine({'server': k3s_kubeconfig_server})}],
           'users': (k3s_local.users | default([], true)
                     | rejectattr('name', 'equalto', k3s_name) | list)
                    + [{'name': k3s_name, 'user': k3s_node.users[0].user}],
           'contexts': (k3s_local.contexts | default([], true)
                        | rejectattr('name', 'equalto', k3s_name) | list)
                       + [{'name': k3s_name,
                           'context': {'cluster': k3s_name, 'user': k3s_name}}],
           'current-context': k3s_local['current-context'] | default(k3s_name, true),
         }) }}
  delegate_to: localhost
  become: false
  no_log: true
  diff: false
  when: k3s_kubeconfig is not skipped
