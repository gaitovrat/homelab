---
- name: Install deb822_repository prerequisites
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "{{ tailscale_apt_url }}"
    suites: "{{ tailscale_apt_codename }}"
    components: main
    signed_by: "{{ tailscale_apt_url }}/{{ tailscale_apt_codename }}.gpg"

# Keep `apt upgrade` from moving tailscale off the version pinned here;
# bumps come through Renovate PRs against tailscale_version.
- name: Pin Tailscale version in apt
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/tailscale
    mode: "0644"
    content: |
      Package: tailscale
      Pin: version {{ tailscale_version }}
      Pin-Priority: 1001

- name: Install Tailscale
  ansible.builtin.apt:
    name: "tailscale={{ tailscale_version }}"
    state: present
    update_cache: true
    allow_downgrade: true

- name: Enable and start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Get Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false

- name: Read Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: "{{ (tailscale_status.stdout | from_json).BackendState }}"

- name: Require an auth key for the first login
  ansible.builtin.assert:
    that: tailscale_authkey | length > 0
    fail_msg: >-
      {{ inventory_hostname }} is not logged in to Tailscale. Pass an auth key with
      -e tailscale_authkey=tskey-auth-... or the TAILSCALE_AUTHKEY env var.
    quiet: true
  when: tailscale_backend_state == 'NeedsLogin'

# Skipped once the node is up, so re-runs make no changes. --reset makes the
# flags below the node's full config.
- name: Bring Tailscale up
  ansible.builtin.command:
    argv: >-
      {{ ['tailscale', 'up', '--reset',
          '--hostname=' ~ tailscale_hostname,
          '--accept-dns=' ~ (tailscale_accept_dns | string | lower)]
         + (['--auth-key=' ~ tailscale_authkey] if tailscale_authkey | length > 0 else []) }}
  when: tailscale_backend_state != 'Running'
  changed_when: true
  no_log: true
