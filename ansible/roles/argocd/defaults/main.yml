---
# Argo CD manages itself through apps/argocd.yaml, and Renovate bumps the
# chart there. This role only bootstraps a cluster from that same file
# (chart, version, values), so the two can't drift.
argocd_apps_dir: "{{ playbook_dir | dirname }}/apps"
argocd_app: "{{ lookup('ansible.builtin.file', argocd_apps_dir ~ '/argocd.yaml') | from_yaml }}"
argocd_root_app: "{{ lookup('ansible.builtin.file', argocd_apps_dir ~ '/root.yaml') | from_yaml }}"

argocd_chart: "oci://{{ argocd_app.spec.source.repoURL }}/{{ argocd_app.spec.source.chart }}"
argocd_chart_version: "{{ argocd_app.spec.source.targetRevision }}"
argocd_values: "{{ argocd_app.spec.source.helm.valuesObject }}"
argocd_namespace: "{{ argocd_app.metadata.namespace }}"

# k3s's auto-deploy directory, used for the bootstrap install only.
argocd_manifests_dir: /var/lib/rancher/k3s/server/manifests
