---
# The argo-cd chart from argo-helm, pulled as OCI from GHCR.
argocd_chart: oci://ghcr.io/argoproj/argo-helm/argo-cd
# renovate: datasource=docker depName=ghcr.io/argoproj/argo-helm/argo-cd
argocd_chart_version: "10.10.2"

argocd_namespace: argocd

# Lean values for a 4 GB node: no Dex (no SSO yet, local admin only), no
# notifications controller. Every other component runs a single replica
# (the chart default), without HA Redis.
argocd_values:
  dex:
    enabled: false
  notifications:
    enabled: false
  controller:
    replicas: 1
  server:
    replicas: 1
  repoServer:
    replicas: 1
  applicationSet:
    replicas: 1
  redis-ha:
    enabled: false
  configs:
    cm:
      # No terminal into pods from the UI.
      exec.enabled: false

# The root "app of apps": one Argo CD Application per component in
# `apps/` of this repo. Everything after Argo CD is deployed from there.
argocd_root_app_name: root
argocd_root_app_repo: https://github.com/gaitovrat/homelab.git
argocd_root_app_revision: main
argocd_root_app_path: apps
